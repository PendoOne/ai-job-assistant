<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Job Assistant — AI求职助手</title>
<meta name="description" content="AI驱动的求职助手：解析岗位JD、匹配技能、生成学习路线、模拟面试">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #fafbfc; color: #1a1a2e;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; text-align:center;
  }
  .hero { max-width:520px; padding:40px 24px; }
  h1 { font-size:28px; font-weight:700; margin-bottom:8px; letter-spacing:-.5px; }
  .sub { font-size:15px; color:#5a5f6e; margin-bottom:32px; line-height:1.6; }
  .features {
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
    margin-bottom:36px;
  }
  .feat {
    background:#fff; border:1px solid #e8e8ee;
    border-radius:10px; padding:12px 18px; font-size:13px;
    color:#4f46e5; font-weight:500;
    transition: box-shadow .2s;
  }
  .feat:hover { box-shadow:0 4px 14px rgba(79,70,229,.08); }
  .btn {
    display:inline-block; background:#4f46e5; color:#fff;
    padding:12px 36px; border-radius:10px; text-decoration:none;
    font-size:15px; font-weight:600; letter-spacing:-.2px;
    transition: background .2s, transform .2s;
  }
  .btn:hover { background:#4338ca; transform:translateY(-1px); }
  .note { margin-top:24px; font-size:12px; color:#9ca3af; }
  .aurora {
    position:fixed; inset:0; pointer-events:none; z-index:-1;
    overflow:hidden;
  }
  .aurora .orb {
    position:absolute; border-radius:50%; filter:blur(120px); opacity:.12;
  }
  .orb-a { width:400px; height:400px; background:#4f46e5; top:-10%; left:-5%; animation:floatA 40s infinite; }
  .orb-b { width:350px; height:350px; background:#7c3aed; bottom:-10%; right:-5%; animation:floatB 45s infinite; }
  @keyframes floatA {
    0%,100% { transform:translate(0,0); }
    33% { transform:translate(60px,40px); }
    66% { transform:translate(-30px,-20px); }
  }
  @keyframes floatB {
    0%,100% { transform:translate(0,0); }
    33% { transform:translate(-50px,-30px); }
    66% { transform:translate(40px,20px); }
  }
</style>
</head>
<body>
<div class="aurora">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
</div>

<div class="hero">
  <h1>AI 求职助手</h1>
  <p class="sub">
    AI驱动的智能求职平台<br>
    从岗位分析到模拟面试，全程AI陪伴
  </p>
  <div class="features">
    <span class="feat">JD解析</span>
    <span class="feat">简历匹配</span>
    <span class="feat">学习路线</span>
    <span class="feat">AI模拟面试</span>
  </div>
  <a class="btn" href="ui/index.html">进入应用 →</a>
  <p class="note">点击进入 AI Job Assistant 工作台</p>
</div>
</body>
</html>
